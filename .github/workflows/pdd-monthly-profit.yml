name: pdd-monthly-profit

on:
  push:
    paths:
      - "pdd-monthly-profit/**"
      - ".github/workflows/pdd-monthly-profit.yml"
  pull_request:
    paths:
      - "pdd-monthly-profit/**"
      - ".github/workflows/pdd-monthly-profit.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pdd-monthly-profit/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r pdd-monthly-profit/requirements.txt
      - name: Check environment
        run: python pdd-monthly-profit/scripts/check_environment.py
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s pdd-monthly-profit/tests -v
